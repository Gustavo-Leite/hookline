version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - noctx
    - gosec
    - misspell
    - errorlint
    - revive

  settings:
    revive:
      # Declaring `rules` replaces revive's default set, so the defaults are
      # spelled out here minus `exported` and `package-comments`: doc comments
      # are the contract of a public library, and this code lives in internal/.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    rules:
      # Test fixtures are meant to look like credentials.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
