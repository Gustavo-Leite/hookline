openapi: 3.0.3

info:
  title: hookline
  version: 0.1.0
  description: |
    Reliable webhook delivery: register endpoints, publish events, and let the
    service own delivery — signing, retrying and dead-lettering.

    Every route under `/v1` requires an API key, created from the command line
    with `docker compose run --rm admin create-application <name>`. Send it as
    `Authorization: Bearer hl_test_...`.
  license:
    name: MIT
    url: https://github.com/Gustavo-Leite/hookline/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness, for orchestrators
  - name: Endpoints
    description: Destinations that receive webhooks
  - name: Events
    description: Event ingestion
  - name: Deliveries
    description: What was sent, what failed, and what can be replayed

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Reports that the process is alive. Touches no dependency.
      security: []
      responses:
        "200":
          description: The process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Reports whether the service can serve traffic, by pinging Postgres and
        Redis under a 2s deadline. Failures are logged in full and reported as
        `unavailable`, so connection strings never reach the response.
      security: []
      responses:
        "200":
          description: Every dependency answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /v1/me:
    get:
      tags: [Endpoints]
      summary: Identify the caller
      description: Returns the application the presented API key belongs to.
      responses:
        "200":
          description: The key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/endpoints:
    post:
      tags: [Endpoints]
      summary: Register an endpoint
      description: |
        Creates a destination and its signing secret. The secret is returned
        **only here** — it is never included in any later response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCreate"
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Endpoint"
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Used to verify the HMAC signature of every delivery
                        example: whsec_tW2O_9-gAijcIHRHcLVEaU6s1R4ZR72JkaRl57Tn4Ek
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      tags: [Endpoints]
      summary: List endpoints
      responses:
        "200":
          description: Every endpoint owned by the caller, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/endpoints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Endpoints]
      summary: Fetch one endpoint
      responses:
        "200":
          description: The endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Endpoints]
      summary: Update an endpoint
      description: |
        Changes only the fields present in the body. Set `disabled` to stop
        delivering to this endpoint without losing it, and back to `false` to
        resume. The signing secret cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointUpdate"
      responses:
        "200":
          description: The updated endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Endpoints]
      summary: Remove an endpoint
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/events:
    post:
      tags: [Events]
      summary: Publish an event
      description: |
        Accepts an event for delivery and answers immediately — `202`, not
        `201`, because delivery has not happened yet.

        Send `Idempotency-Key` to make retries safe. The same key with the same
        payload returns the original event and sets `Idempotent-Replay: true`;
        the same key with a different payload is a client bug and returns `409`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Client-chosen string, unique per application
          schema:
            type: string
            example: abc-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
      responses:
        "202":
          description: Event accepted for delivery
          headers:
            Idempotent-Replay:
              description: Present when the event already existed under this idempotency key
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          description: The idempotency key was already used with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/deliveries:
    get:
      tags: [Deliveries]
      summary: List deliveries
      description: |
        One delivery exists per event per subscribed endpoint, newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, succeeded, dead]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/deliveries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Deliveries]
      summary: Fetch a delivery with its attempt history
      responses:
        "200":
          description: The delivery and every attempt made for it
          content:
            application/json:
              schema:
                type: object
                required: [delivery, attempts]
                properties:
                  delivery:
                    $ref: "#/components/schemas/Delivery"
                  attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/deliveries/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Deliveries]
      summary: Queue a delivery to be sent again
      description: |
        Puts the delivery back in the queue and resets its attempt counter, so a
        dead-lettered delivery gets a full set of retries again. The attempt
        history is kept.
      responses:
        "202":
          description: The delivery was queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key created with the admin CLI

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The API key exceeded its request allowance
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, unknown, revoked or expired API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource for this application
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid api key

    Readiness:
      type: object
      properties:
        postgres:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable]

    EndpointCreate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Must be absolute and https
          example: https://example.com/hooks
        description:
          type: string
          example: production receiver
        event_types:
          type: array
          description: Event types this endpoint subscribes to. Empty means all of them.
          items:
            type: string
          example: [user.created]

    EndpointUpdate:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          description: Must be absolute and https
        description:
          type: string
        event_types:
          type: array
          items:
            type: string
        disabled:
          type: boolean
          description: Stop or resume delivery without deleting the endpoint

    Endpoint:
      type: object
      required: [id, url, description, event_types, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        description:
          type: string
        event_types:
          type: array
          items:
            type: string
        disabled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventCreate:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          example: user.created
        payload:
          type: object
          description: Any JSON value. Delivered verbatim to the subscribed endpoints.
          additionalProperties: true
          example:
            id: 42

    Delivery:
      type: object
      required: [id, event_id, endpoint_id, status, attempt_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, succeeded, dead]
        attempt_count:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Attempt:
      type: object
      required: [attempt_number, duration_ms, attempted_at]
      properties:
        attempt_number:
          type: integer
        status_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: Set when the request never produced a response
        duration_ms:
          type: integer
        attempted_at:
          type: string
          format: date-time

    Event:
      type: object
      required: [id, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        created_at:
          type: string
          format: date-time
